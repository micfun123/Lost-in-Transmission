server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Game package changes every build, so don't let browsers keep an old one
    location ~* \.(apk|tar\.gz|html)$ {
        add_header Cache-Control "no-cache";
    }
}
